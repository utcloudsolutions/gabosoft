services:
  # ── Backend — Express API ──────────────────────────────────────────────────
  - type: web
    name: techtransit-backend
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run db:generate -w backend && npm run build -w backend
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Conexión Supabase — configurar en el dashboard de Render
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Secrets JWT — generar con: openssl rand -hex 40
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      # URL del frontend (para CORS) — completar tras crear el Static Site
      - key: FRONTEND_URL
        sync: false

  # ── Frontend — React/Vite Static Site ────────────────────────────────────
  - type: web
    name: techtransit-frontend
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build -w frontend
    staticPublishPath: frontend/dist
    routes:
      # SPA: todas las rutas sirven index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL completa del backend incluyendo /api/v1
      # Ejemplo: https://techtransit-backend.onrender.com/api/v1
      - key: VITE_API_BASE_URL
        sync: false
